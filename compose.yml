name: baust_website

services:
  # ====================================
  #         Laravel Application
  # ====================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: baust_web_app:latest
    container_name: baust_web_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8086}:80"   # Local debug only; public traffic arrives via the tunnel
    expose:
      - "80"
    environment:
      - APP_NAME=BAUST
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-https://baust.edu.bd}
      - LOG_LEVEL=${LOG_LEVEL:-warning}
      - TZ=Asia/Dhaka
      - IQAC_ADMIN_PASSWORD=${IQAC_ADMIN_PASSWORD}

      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - SESSION_LIFETIME=${SESSION_LIFETIME:-120}
      - SESSION_SECURE_COOKIE=${SESSION_SECURE_COOKIE:-true}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - CACHE_STORE=${CACHE_STORE:-database}
      - BROADCAST_CONNECTION=${BROADCAST_CONNECTION:-log}
      - FILESYSTEM_DISK=${FILESYSTEM_DISK:-local}
      - TRUSTED_PROXIES=*

      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_HOST=${MAIL_HOST:-127.0.0.1}
      - MAIL_PORT=${MAIL_PORT:-2525}
      - MAIL_SCHEME=${MAIL_SCHEME:-}
      - MAIL_USERNAME=${MAIL_USERNAME:-null}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-null}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-hello@baust.edu.bd}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-BAUST}
      - MAIL_COUNSELING_TO=${MAIL_COUNSELING_TO:-psychologist@baust.edu.bd}
      - MAIL_ADMIN_ACTIVITY_TO=${MAIL_ADMIN_ACTIVITY_TO:-website@baust.edu.bd}
      - MAIL_UPDATE_REQUESTS_TO=${MAIL_UPDATE_REQUESTS_TO:-website@baust.edu.bd}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M   # PHP-FPM + nginx + the Node SSR renderer
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend
      - backend
    volumes:
      - app_storage:/var/www/html/storage

  # ====================================
  #         MySQL 8.4 Database
  # ====================================
  mysql:
    image: mysql:8.4
    container_name: baust_web_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - --skip-name-resolve
      - --max-connections=100
      - --local-infile=0
    volumes:
      - mysql_data:/var/lib/mysql
      # Seeds a BRAND-NEW volume from the real dataset. MySQL only runs
      # /docker-entrypoint-initdb.d on an empty data dir, so this is a no-op on
      # every subsequent boot and can never overwrite a live database.
      - ./backup.sql:/docker-entrypoint-initdb.d/01-baust_website.sql:ro
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3309}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - dbaccess

  # ====================================
  #         Cloudflare Tunnel
  # ====================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: baust_web_tunnel
    # Opt-in: start with `docker compose --profile tunnel up -d` once CLOUDFLARE_TUNNEL_TOKEN is set.
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    depends_on:
      app:
        condition: service_started
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
  backend:
    internal: true
    driver: bridge
  dbaccess:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  app_storage:
    driver: local
