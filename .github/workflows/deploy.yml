name: deploy

# Manual only: deploys `main` to the VPS when started from the Actions tab
# ("Run workflow"). Pushes no longer deploy automatically; production is deployed by
# hand with `docker compose up -d --build` on the VPS. To restore automatic deploys
# after a passing `tests` run, add back:
#   workflow_run: { workflows: [tests], types: [completed], branches: [main] }
# Setup (secrets, deploy keys) is described in DEPLOY.md.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_DIR
          command_timeout: 30m
          script: |
            set -e
            cd "${APP_DIR:?APP_DIR variable is not set}"
            git fetch --prune origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            docker image prune -f

            PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2 | tr -d '"')
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${PORT:-8086}/up" > /dev/null; then
                echo "Deployed $(git rev-parse --short HEAD)"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed"
            docker compose logs --tail=100 app
            exit 1
