server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Canonical host: www.baust.edu.bd -> baust.edu.bd. Both hostnames must be routed on the
    # Cloudflare tunnel, otherwise this sends www visitors to a dead address.
    if ($host = www.baust.edu.bd) {
        return 301 https://baust.edu.bd$request_uri;
    }

    # Max upload size
    client_max_body_size 64M;

    # Old WordPress media (baust.edu.bd/wp-content/uploads/…, baust.edu.bd/cse/wp-content/uploads/…),
    # mirrored by `php artisan media:mirror-legacy` into the persistent storage volume.
    location ~ ^(/[a-z]+)?/wp-content/uploads/ {
        root /var/www/html/storage/app/public/legacy-wp;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM handling
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass_header Date;
        fastcgi_read_timeout 600;

        # FastCGI buffer settings to prevent 502 "upstream sent too big header"
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
