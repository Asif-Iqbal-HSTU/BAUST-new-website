# The same request URI without trailing slashes ("/eng/" -> "/eng", "/a/?x=1" -> "/a?x=1").
# Unchanged for "/" and for URIs that do not end in a slash.
map $request_uri $baust_clean_uri {
    default                                  $request_uri;
    "~^(?<path>/[^?]*[^/?])/+(?<query>\?.*)?$" $path$query;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Redirects carry a path-only Location ("/eng"), so the browser stays on the https origin it
    # used; nginx itself only ever sees plain http from the Cloudflare tunnel.
    absolute_redirect off;

    # Canonical host: www.baust.edu.bd -> baust.edu.bd, in one hop that also drops a trailing
    # slash. Both hostnames must be routed on the Cloudflare tunnel, otherwise this sends www
    # visitors to a dead address.
    if ($host = www.baust.edu.bd) {
        return 301 https://baust.edu.bd$baust_clean_uri;
    }

    # Canonical path: no trailing slash ("/admission/tuition-fees/" -> "/admission/tuition-fees").
    if ($baust_clean_uri != $request_uri) {
        return 301 $baust_clean_uri;
    }

    # Compress text responses on the origin hop as well (Cloudflare re-compresses at the edge).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript
               application/ld+json image/svg+xml font/ttf font/otf;

    # Max upload size
    client_max_body_size 100M;

    # Old WordPress media (baust.edu.bd/wp-content/uploads/…, baust.edu.bd/cse/wp-content/uploads/…),
    # mirrored by `php artisan media:mirror-legacy` into the persistent storage volume.
    location ~ ^(/[a-z]+)?/wp-content/uploads/ {
        root /var/www/html/storage/app/public/legacy-wp;
        # Media that was never mirrored is gone for good: 410 tells search engines to drop it.
        try_files $uri =410;
        expires 30d;
        access_log off;
    }

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Old WordPress PHP endpoints (wp-login.php, xmlrpc.php, ...): the .php block below would hand
    # them to PHP-FPM as missing scripts (404) before Laravel's legacy handling sees them.
    location ~ ^/(?:[a-z]+/)?(?:wp-[a-z-]+|xmlrpc)\.php$ {
        return 410;
    }

    # PHP-FPM handling
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass_header Date;
        fastcgi_read_timeout 600;

        # FastCGI buffer settings to prevent 502 "upstream sent too big header"
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache static assets. An add_header here replaces the server-level ones, so the security
    # headers are repeated.
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
